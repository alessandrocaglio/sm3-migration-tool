apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sm3-migration.fullname" . }}
  labels:
    {{- include "sm3-migration.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sm3-migration.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sm3-migration.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sm3-migration.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          args:
            - "serve"
            - "--mode"
            - "live"
            - "--port"
            - "8080"
            - "--allowed-namespaces-regex"
            - {{ .Values.config.allowedNamespacesRegex | quote }}
