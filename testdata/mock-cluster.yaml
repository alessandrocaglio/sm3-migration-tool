sm2_control_planes:
  - kind: ServiceMeshControlPlane
    name: basic
    namespace: team-servicemesh
    spec:
      version: 2.6.14
smmr:
  - kind: ServiceMeshMemberRoll
    name: default
    namespace: team-servicemesh
    spec:
      memberSelectors:
        - matchLabels:
            servicemesh: mine
    status:
      members:
        - team-servicemesh
        - ns1
        - ns2
namespaces:
  - kind: Namespace
    name: team-servicemesh
  - kind: Namespace
    name: ns1
  - kind: Namespace
    name: ns2
authorization_policies:
  - kind: AuthorizationPolicy
    name: allow-nothing
    namespace: ns1
peer_authentications:
  - kind: PeerAuthentication
    name: default
    namespace: team-servicemesh
    spec:
      mtls:
        mode: STRICT
sidecars:
  - kind: Sidecar
    name: default
    namespace: ns2
virtual_services:
  - kind: VirtualService
    name: app-vs
    namespace: ns1
gateways:
  - kind: Gateway
    name: main-gateway
    namespace: team-servicemesh
  - kind: ServiceEntry
    name: missing-ports
    namespace: bookinfo
    spec:
      hosts: ["h1.com"]
routes:
  - kind: Route
    name: bad-route
    namespace: bookinfo
    labels:
      maistra.io/generated-by: ior
