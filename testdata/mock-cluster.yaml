sm2_control_planes:
  - kind: ServiceMeshControlPlane
    name: basic
    namespace: istio-system
    spec:
      version: 2.6.14
      security:
        manageNetworkPolicy: true
      gateways:
        enabled: true
        openshiftRoute:
          enabled: true
      addons:
        grafana:
          enabled: true
        prometheus:
          enabled: true
        kiali:
          enabled: true
      tracing:
        type: Jaeger
  - kind: ServiceMeshControlPlane
    name: tenant-mesh
    namespace: tenant-admin
    spec:
      version: 2.6.14
smmr:
  - kind: ServiceMeshMemberRoll
    name: default
    namespace: istio-system
    spec:
      members:
        - bookinfo
        - istio-system
  - kind: ServiceMeshMemberRoll
    name: default
    namespace: tenant-admin
    spec:
      members:
        - tenant-app-1
        - tenant-app-2
